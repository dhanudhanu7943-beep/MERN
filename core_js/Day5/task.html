//task-4
console.log("4.Calculate the total salary of five employees using reduce()");
const detail=[
    { name: "Ravi", salary: 25000 },
    { name: "Priya", salary: 30000 },
    { name: "Kumar", salary: 35000 },
    { name: "Divya", salary: 40000 },
    { name: "Arun", salary: 45000 }];
const total=detail.reduce((accumlator,current)=>{
return accumlator+current.salary
},0)
console.log(total);



//Task-5
console.log("5.Calculate a shopping cart's total using price * quantity.");

const cart = [
    { name: "Laptop", quantity: 1, price: 50000 },
    { name: "Mouse", quantity: 2, price: 500 },
    { name: "Keyboard", quantity: 1, price: 1500 },
    { name: "Headphones", quantity: 2, price: 2000 },
    { name: "Monitor", quantity: 1, price: 12000 }
];
const totals=cart.reduce((val,get)=>{
return val+get.price*get.quantity
},0)
console.log(totals);
